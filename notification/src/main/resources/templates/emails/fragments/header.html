<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<td th:fragment="header" class="header-cell"
    style="padding: 40px 32px 20px; background-color: #ffffff;">

    <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center"
           style="margin: 0 auto;">
        <tr>
            <td valign="middle" style="padding: 0 10px 0 0; line-height: 0;">
                <img src="cid:lynkLogo"
                     alt=""
                     width="40"
                     height="40"
                     style="display: block; width: 40px; height: 40px; border: 0;">
            </td>
            <td valign="middle" class="wordmark"
                style="font-family: 'Space Grotesk', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                       font-size: 34px; font-weight: 700; letter-spacing: -1px; line-height: 40px;
                       color: #1b1b24; white-space: nowrap;">
                Lynk
            </td>
        </tr>
    </table>

</td>
</body>
</html>
