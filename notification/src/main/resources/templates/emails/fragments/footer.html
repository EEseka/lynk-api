<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<td th:fragment="footer" class="footer-band"
    style="background-color: #ffffff; border-top: 1px solid #e4e0f4; padding: 28px 32px 40px;
           text-align: center;">

    <p class="footer-text"
       style="margin: 0 0 10px; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
              font-size: 14px; line-height: 1.6; color: #464555;">
        Questions? Reach us at
        <a href="mailto:support@lynk.com.ng" class="footer-link-accent"
           style="color: #4d41df; text-decoration: underline;">support@lynk.com.ng</a>
    </p>

    <p class="footer-text"
       style="margin: 0; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
              font-size: 13px; line-height: 1.6; color: #777587;">
        <a th:href="${baseUrl}" class="footer-link"
           style="color: #777587; text-decoration: underline;">Lynk</a>
        &middot; Copyright &copy;
        <span th:text="${#temporals.year(#temporals.createNow())}">2026</span>. All rights reserved.
    </p>

</td>
</body>
</html>
