<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(content, title, preheader)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <title th:text="${title}">Email from Lynk</title>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap"
          rel="stylesheet">

    <!--[if mso]>
    <style>
        * { font-family: 'Segoe UI', Arial, sans-serif !important; }
    </style>
    <![endif]-->

    <style>
        :root {
            color-scheme: light dark;
            supported-color-schemes: light dark;
        }

        body, table, td, a {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }

        table, td {
            mso-table-lspace: 0;
            mso-table-rspace: 0;
            border-collapse: collapse;
        }

        h1, h2, p, td {
            mso-line-height-rule: exactly;
        }

        /* The page and the card share one colour so the email sits flush against the
           client's own background - pure white in light (surfaceContainerLowestLight,
           rather than the app's slightly tinted backgroundLight, because inboxes render
           on white), pure black in dark to match backgroundDark. Structure comes from
           the rules and the footer band, never from a card edge. */
        @media (prefers-color-scheme: dark) {
            .email-body, .email-container, .header-cell, .content-cell, .footer-band {
                background-color: #000000 !important; /* backgroundDark */
            }

            .heading, .wordmark {
                color: #e4e1ee !important; /* onBackgroundDark */
            }

            .body-text, .mono {
                color: #e4e1ee !important; /* onBackgroundDark */
            }

            .note {
                background-color: #0f0f18 !important; /* surfaceContainerLowDark */
                border-color: #1e1d27 !important; /* surfaceContainerHighDark */
            }

            .note-text {
                color: #c7c4d8 !important; /* onSurfaceVariantDark */
            }

            .link, .footer-link-accent {
                color: #c3c0ff !important; /* primaryDark */
            }

            .footer-band {
                border-top-color: #1e1d27 !important; /* surfaceContainerHighDark */
            }

            .footer-text {
                color: #918fa1 !important; /* outlineDark */
            }

            .footer-link {
                color: #918fa1 !important; /* outlineDark */
            }
        }

        @media only screen and (max-width: 620px) {
            .header-cell {
                padding: 32px 20px 4px !important;
            }

            .content-cell {
                padding: 4px 20px 32px !important;
            }

            .footer-band {
                padding: 24px 20px !important;
            }

            .heading {
                font-size: 26px !important;
            }
        }
    </style>
</head>
<body class="email-body"
      style="margin: 0; padding: 0; width: 100%; background-color: #ffffff;
             font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">

<div class="preheader"
     style="display: none; max-height: 0; overflow: hidden; mso-hide: all;
            font-size: 1px; line-height: 1px; color: #ffffff; opacity: 0;"
     th:text="${preheader}">Email from Lynk
</div>

<div style="display: none; max-height: 0; overflow: hidden; mso-hide: all;">
    &#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;
    &#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;
    &#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;
    &#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;
</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       class="email-body" style="background-color: #ffffff;">
    <tr>
        <td align="center" style="padding: 0;">

            <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
                   class="email-container"
                   style="width: 100%; max-width: 600px; background-color: #ffffff;">

                <tr>
                    <td th:replace="~{emails/fragments/header :: header}"></td>
                </tr>

                <tr>
                    <td class="content-cell"
                        style="padding: 8px 32px 40px; background-color: #ffffff;">
                        <div th:replace="${content}">
                            <!-- Content goes here -->
                        </div>
                    </td>
                </tr>

                <tr>
                    <td th:replace="~{emails/fragments/footer :: footer}"></td>
                </tr>

            </table>

        </td>
    </tr>
</table>
</body>
</html>
